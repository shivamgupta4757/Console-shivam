name: Deploy Vite + React Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping queued runs between in-progress and latest
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Verify compiled dist/index.html, dist/CNAME, and .nojekyll
        run: |
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/CNAME
          grep -qx "shivamgupta.xyz" dist/CNAME
          if grep -q "/src/main.tsx" dist/index.html; then
            echo "ERROR: dist/index.html still references uncompiled /src/main.tsx!"
            exit 1
          fi
          grep -qE 'src="/assets/index-[^"]+\.js"' dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for any legacy branch Pages build to finish first
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking for competing 'pages build and deployment' workflow runs..."
          sleep 5
          for i in $(seq 1 24); do
            ACTIVE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?per_page=10" | \
              node -e '
                const data = JSON.parse(require("fs").readFileSync(0, "utf8") || "{}");
                const active = (data.workflow_runs || []).filter(
                  r => r.name === "pages build and deployment" && r.status !== "completed"
                );
                console.log(active.length);
              ')
            if [ "$ACTIVE" = "0" ]; then
              echo "No competing branch Pages build is active."
              break
            fi
            echo "Waiting for 'pages build and deployment' to finish ($i/24)..."
            sleep 5
          done
          sleep 3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
